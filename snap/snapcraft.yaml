name: rahasyakosh
title: Rahasyakosh
base: core24
version: "0.1.0-alpha.1"
summary: Local-first, end-to-end-encrypted password manager
description: |
  Rahasyakosh keeps your logins and two-factor codes in an encrypted vault
  on your own computer. There are no accounts, no telemetry and no network
  access.

  Each person sharing the computer can have a profile with their own vault
  and master password. Passwords can be imported from browsers and other
  password managers (Bitwarden, KeePassXC, 1Password) and exported again.

  Full screen-reader support via AT-SPI/Orca.

  Early alpha. It has not been independently audited — do not store real
  secrets until an audit is complete.

license: MIT
icon: apps/desktop/packaging/rahasyakosh.svg
website: https://github.com/enhariharan/rahasyakosh
source-code: https://github.com/enhariharan/rahasyakosh
issues: https://github.com/enhariharan/rahasyakosh/issues
contact: https://github.com/enhariharan
grade: stable
confinement: strict

apps:
  rahasyakosh:
    command: bin/rahasyakosh-launcher
    desktop: usr/share/applications/rahasyakosh.desktop
    # The gnome extension:
    #   - sets GNOME content snap as a stage-package source for GTK/GLib/GDK
    #   - adds the gtk-3-themes, icon-themes and sound-themes content plugs
    #   - wires up desktop, desktop-legacy, wayland, x11, opengl
    #   - sets XDG_DATA_DIRS, GDK_PIXBUF_MODULE_FILE, etc.
    extensions: [gnome]
    environment:
      # Inside a snap GLib asks the desktop portal for proxy settings, and the
      # portal refuses snaps without the `network` plug, so WebKit never opens
      # the 127.0.0.1 WebSocket (blank white window). The app only talks to
      # itself on loopback, so connect directly and skip proxy lookups.
      GIO_USE_PROXY_RESOLVER: dummy
    plugs:
      # No personal-files plug: snapd sets $HOME to ~/snap/rahasyakosh/<rev>/,
      # so the vault lives there, separate from a deb install's ~/.local/share.
      - home                # non-hidden files in ~ (import/export files)
      - desktop-legacy      # AT-SPI accessibility bus (Orca)
      - unity7              # system tray: AppIndicator/StatusNotifier D-Bus (X11 and Wayland)
      # Dioxus Desktop sends UI updates to the WebKit view over a WebSocket on
      # 127.0.0.1 (random port, secret key per connection); without this the
      # app panics with "Failed to bind local TCP listener for edit socket".
      - network-bind

parts:
  desktop-app:
    plugin: rust
    # The whole repo is needed because apps/desktop depends on ../../crates/*.
    # source-type git clones only committed files, so the multi-GB target/
    # directories are not copied into the build container. Commit before packing.
    source: .
    source-type: git
    source-subdir: apps/desktop
    build-environment:
      # The gnome extension points LD_LIBRARY_PATH at the GNOME SDK, whose libc
      # makes the rustup snap (and so cargo/rustc) crash with a symbol lookup
      # error. Linking finds GTK/WebKit through pkg-config, so this is not needed.
      - LD_LIBRARY_PATH: ""
    override-build: |
      # This override replaces the plugin's own build steps, including its
      # toolchain setup, so install one here (workspace needs Rust >= 1.89).
      rustup toolchain install stable --profile minimal
      rustup default stable
      # override-build runs from the part's build root, not source-subdir, so
      # enter the desktop crate (its own workspace) explicitly.
      cd apps/desktop
      # snapcraft's rust plugin does not pass --locked by default
      cargo build --release --locked
      install -Dm755 target/release/rahasyakosh-desktop "$SNAPCRAFT_PART_INSTALL/usr/bin/rahasyakosh-desktop"

    build-packages:
      - libwebkit2gtk-4.1-dev
      - libgtk-3-dev
      - libxdo-dev
      - libayatana-appindicator3-dev
      - libsoup-3.0-dev
      # openssl-sys comes in via dioxus-desktop -> tungstenite -> native-tls
      # (dev hot-reload websocket); the app itself makes no network calls.
      - libssl-dev
      # SQLite is bundled via rusqlite "bundled" feature, so no libsqlite3-dev needed.
      # clang/libclang are needed by bindgen (webkit2gtk and xdo bindings).
      - clang
      - libclang-dev
      - pkg-config

    stage-packages:
      - libwebkit2gtk-4.1-0
      - libgtk-3-0
      - libxdo3
      - libayatana-appindicator3-1
      - libsoup-3.0-0
      # JavaScriptCore is pulled in by webkit2gtk but list it explicitly so
      # snapcraft doesn't silently drop it.
      - libjavascriptcoregtk-4.1-0

  launcher:
    plugin: dump
    source: apps/desktop/packaging
    organize:
      rahasyakosh-launcher: bin/rahasyakosh-launcher
    stage:
      - bin/rahasyakosh-launcher

  desktop-files:
    plugin: dump
    source: apps/desktop/packaging
    organize:
      rahasyakosh-system.desktop: usr/share/applications/rahasyakosh.desktop
      rahasyakosh-chest.svg: usr/share/icons/hicolor/scalable/apps/rahasyakosh.svg
      io.github.enhariharan.Rahasyakosh.metainfo.xml: usr/share/metainfo/io.github.enhariharan.Rahasyakosh.metainfo.xml
    stage:
      - usr/share/applications/rahasyakosh.desktop
      - usr/share/icons/hicolor/scalable/apps/rahasyakosh.svg
      - usr/share/metainfo/io.github.enhariharan.Rahasyakosh.metainfo.xml

  png-icons:
    plugin: dump
    source: apps/desktop/packaging/icons
    organize:
      rahasyakosh-16.png:  usr/share/icons/hicolor/16x16/apps/rahasyakosh.png
      rahasyakosh-32.png:  usr/share/icons/hicolor/32x32/apps/rahasyakosh.png
      rahasyakosh-48.png:  usr/share/icons/hicolor/48x48/apps/rahasyakosh.png
      rahasyakosh-64.png:  usr/share/icons/hicolor/64x64/apps/rahasyakosh.png
      rahasyakosh-128.png: usr/share/icons/hicolor/128x128/apps/rahasyakosh.png
      rahasyakosh-256.png: usr/share/icons/hicolor/256x256/apps/rahasyakosh.png
      rahasyakosh-512.png: usr/share/icons/hicolor/512x512/apps/rahasyakosh.png
    stage:
      - usr/share/icons/
