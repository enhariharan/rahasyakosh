[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]

[advisories]
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib", # permissive; used by foldhash, a dependency of the optional SQLite backend
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { crate = "openssl" },
    { crate = "openssl-sys" },
    { crate = "ring" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
