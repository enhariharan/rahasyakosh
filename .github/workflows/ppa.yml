name: PPA

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

env:
  CARGO_TERM_COLOR: always

jobs:
  ppa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev \
            libayatana-appindicator3-dev libsoup-3.0-dev \
            build-essential dput devscripts debhelper

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop -> apps/desktop/target

      - name: Build desktop binary
        working-directory: apps/desktop
        run: cargo build --release --locked

      - name: Set up GPG for signing
        env:
          PPA_GPG_KEY: ${{ secrets.PPA_GPG_KEY }}
          PPA_GPG_PASSPHRASE: ${{ secrets.PPA_GPG_PASSPHRASE }}
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          gpgconf --kill gpg-agent
          echo "$PPA_GPG_KEY" | gpg --batch --import
          # Pre-cache the passphrase so dpkg-buildpackage can sign non-interactively
          echo "$PPA_GPG_PASSPHRASE" | gpg --batch --passphrase-fd 0 \
            --pinentry-mode loopback -u "0CA81C7A013EC6CD508B6B823AA5402D46C7F229" \
            --output /dev/null --sign /dev/null 2>&1 || true

      - name: Derive Debian version from tag
        run: |
          # v0.1.0-alpha.5 → 0.1.0~alpha5
          DEB_VERSION=$(echo "${GITHUB_REF_NAME#v}" | \
            sed 's/-alpha\./~alpha/;s/-beta\./~beta/;s/-rc\./~rc/')
          echo "DEB_VERSION=${DEB_VERSION}" >> "$GITHUB_ENV"
          echo "Debian version: ${DEB_VERSION}"

      - name: Build orig tarball
        run: |
          mkdir -p /tmp/rk-orig/rahasyakosh-"${DEB_VERSION}"
          cp apps/desktop/target/release/rahasyakosh-desktop \
            /tmp/rk-orig/rahasyakosh-"${DEB_VERSION}"/
          cp apps/desktop/packaging/rahasyakosh-launcher \
            /tmp/rk-orig/rahasyakosh-"${DEB_VERSION}"/
          cp apps/desktop/packaging/rahasyakosh-system.desktop \
            /tmp/rk-orig/rahasyakosh-"${DEB_VERSION}"/
          cp apps/desktop/packaging/rahasyakosh-chest.svg \
            /tmp/rk-orig/rahasyakosh-"${DEB_VERSION}"/
          cp apps/desktop/packaging/io.github.enhariharan.Rahasyakosh.metainfo.xml \
            /tmp/rk-orig/rahasyakosh-"${DEB_VERSION}"/
          tar -czf /tmp/rahasyakosh_"${DEB_VERSION}".orig.tar.gz \
            -C /tmp/rk-orig rahasyakosh-"${DEB_VERSION}"

      - name: Upload to PPA for each Ubuntu series
        env:
          PPA_GPG_PASSPHRASE: ${{ secrets.PPA_GPG_PASSPHRASE }}
        run: |
          KEY_FP="0CA81C7A013EC6CD508B6B823AA5402D46C7F229"
          DATE=$(date -R)

          # Supported Ubuntu series only: Launchpad refuses uploads to
          # end-of-life ("Obsolete") series. Check before each release with
          #   curl -s https://api.launchpad.net/devel/ubuntu/series
          # jammy (22.04) is left out: its glibc 2.35 is older than the 2.39
          # this runner's build needs. See docs/deploy/ppa_release_checklist.md.
          for SERIES in noble resolute stonking; do
            echo "=== Building for ${SERIES} ==="
            DEB_REV="1~${SERIES}1"
            BUILD_DIR="/tmp/rk-ppa-${SERIES}"
            rm -rf "${BUILD_DIR}" && mkdir "${BUILD_DIR}"
            cp /tmp/rahasyakosh_"${DEB_VERSION}".orig.tar.gz "${BUILD_DIR}/"

            cd "${BUILD_DIR}"
            tar -xzf rahasyakosh_"${DEB_VERSION}".orig.tar.gz
            cp -r "${GITHUB_WORKSPACE}/apps/desktop/debian" \
              rahasyakosh-"${DEB_VERSION}"/

            # Write a series-specific changelog (printf avoids heredoc YAML conflict)
            printf 'rahasyakosh (%s-%s) %s; urgency=low\n\n  * Release %s.\n\n -- Hariharan Narayanan <enhariharan@gmail.com>  %s\n' \
              "${DEB_VERSION}" "${DEB_REV}" "${SERIES}" "${GITHUB_REF_NAME}" "${DATE}" \
              > rahasyakosh-"${DEB_VERSION}"/debian/changelog

            cd rahasyakosh-"${DEB_VERSION}"
            dpkg-buildpackage -S -sa -k"${KEY_FP}"

            cd "${BUILD_DIR}"
            dput ppa:enhariharan/rahasyakosh \
              rahasyakosh_"${DEB_VERSION}"-"${DEB_REV}"_source.changes
          done
