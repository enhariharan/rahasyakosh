name: Snap

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

jobs:
  snap:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so git describe can find the nearest tag for the
          # version override below.
          fetch-depth: 0

      - name: Set snap version from tag
        # snapcraft.yaml keeps the last released version for local builds.
        # In CI we overwrite it with the tag so the published snap matches the
        # GitHub release, e.g. v0.1.0-alpha.1 → 0.1.0-alpha.1.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version:.*/version: \"$VERSION\"/" snap/snapcraft.yaml

      - uses: snapcore/action-build@v1
        id: build

      - name: Determine release channel
        id: channel
        run: |
          TAG="$GITHUB_REF_NAME"
          if [[ "$TAG" == *alpha* || "$TAG" == *beta* || "$TAG" == *rc* ]]; then
            echo "channel=edge" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi

      - uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ steps.channel.outputs.channel }}
