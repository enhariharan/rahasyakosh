name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev \
            libayatana-appindicator3-dev libsoup-3.0-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop -> apps/desktop/target

      - name: Build CLI
        run: cargo build -p rahasyakosh-cli --release --locked

      - name: Build desktop
        working-directory: apps/desktop
        run: cargo build --release --locked

      - name: Strip binaries
        run: |
          strip target/release/rk
          strip apps/desktop/target/release/rahasyakosh-desktop

      - name: Install release tools
        run: cargo install cargo-cyclonedx cargo-deb --locked

      - name: Generate SBOM
        run: |
          cargo cyclonedx --manifest-path Cargo.toml --format json
          cargo cyclonedx --manifest-path apps/desktop/Cargo.toml --format json

      - name: Derive Debian version from tag
        run: |
          # v0.1.0-alpha.9 → 0.1.0~alpha9, the same rule ppa.yml uses. The "~"
          # makes apt rank a pre-release below the final 0.1.0 and below later
          # PPA builds, so people who install this .deb still get upgrades.
          # (Without it the package was 0.1.0-1, which apt ranks above every
          # PPA alpha and even the PPA's final 0.1.0-1~noble1.)
          DEB_VERSION=$(echo "${GITHUB_REF_NAME#v}" | \
            sed 's/-alpha\./~alpha/;s/-beta\./~beta/;s/-rc\./~rc/')
          echo "DEB_VERSION=${DEB_VERSION}" >> "$GITHUB_ENV"
          echo "Debian version: ${DEB_VERSION}-1"

      - name: Build .deb
        working-directory: apps/desktop
        # The package inside carries the Debian version; the file is named after
        # the tag (no "~", which is awkward in URLs), so each release has its own
        # predictable download name, e.g. rahasyakosh_0.1.0-alpha.9_amd64.deb.
        # The AUR PKGBUILD downloads it by that name.
        run: |
          mkdir -p ../../dist
          cargo deb --no-build --deb-version "${DEB_VERSION}-1" \
            --output "../../dist/rahasyakosh_${GITHUB_REF_NAME#v}_amd64.deb"

      - name: Collect release files and SHA-256 checksums
        run: |
          cp target/release/rk apps/desktop/target/release/rahasyakosh-desktop dist/
          # Bare file names, so `sha256sum --check` works in the download folder.
          cd dist
          sha256sum rk rahasyakosh-desktop rahasyakosh_*_amd64.deb > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest rk
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/rk

      - name: Attest rahasyakosh-desktop
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/rahasyakosh-desktop

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: false
          body: |
            **Alpha release — Rahasyakosh has not been independently audited. Do not store real secrets.**

            ## Verify downloads

            Download `SHA256SUMS.txt` into the same folder as the files you downloaded and run:
            ```
            sha256sum --check --ignore-missing SHA256SUMS.txt
            ```

            Build provenance is recorded via sigstore. Verify with the [GitHub CLI](https://cli.github.com/):
            ```
            gh attestation verify rk --repo enhariharan/rahasyakosh
            gh attestation verify rahasyakosh-desktop --repo enhariharan/rahasyakosh
            ```
          files: |
            dist/rk
            dist/rahasyakosh-desktop
            dist/rahasyakosh_*_amd64.deb
            dist/SHA256SUMS.txt
            *.cdx.json
            apps/desktop/*.cdx.json
