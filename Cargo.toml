[workspace]
resolver = "2"
members = ["crates/core", "crates/strength", "crates/transfer", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/enhariharan/rahasyakosh"
rust-version = "1.85"

# Optimise dependencies even in dev/test builds: Argon2 is deliberately heavy and unusably slow unoptimised.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
strip = true
