[workspace]
resolver = "2"
members = ["crates/core", "crates/strength", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/enhariharan/rahasyakosh"
rust-version = "1.85"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
strip = true
