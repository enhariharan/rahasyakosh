[package]
name = "rahasyakosh-transfer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Import and export formats (CSV, JSON) for Rahasyakosh; pure functions, no file or terminal I/O"

[dependencies]
csv = "1.4.0"
rahasyakosh-core = { version = "0.1.0", path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = "1.28.0"
zeroize = "1.9.1"

# proptest (via rusty-fork) does not build for WASI; property tests run natively only.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = "1.12.0"
