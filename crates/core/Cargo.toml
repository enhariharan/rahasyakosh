[package]
name = "rahasyakosh-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
base64 = "0.23.1"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
hkdf = "0.13.0"
hmac = "0.13.0"
rand_core = "0.10.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["serde"] }
zeroize = { version = "1.9.1", features = ["derive"] }
zxcvbn = { version = "3.1.1", default-features = false }

[dev-dependencies]
proptest = "1.12.0"
rand_chacha = "0.10.0"
