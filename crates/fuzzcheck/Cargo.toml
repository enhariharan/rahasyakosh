[package]
name = "rahasyakosh-fuzzcheck"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Robustness checks for every parser of untrusted input; driven by cargo-fuzz and by ordinary tests"

[dependencies]
rahasyakosh-app = { version = "0.1.0", path = "../app" }
rahasyakosh-core = { version = "0.1.0", path = "../core" }
rahasyakosh-store = { version = "0.1.0", path = "../store", features = ["sqlite"] }
rahasyakosh-strength = { version = "0.1.0", path = "../strength" }
rahasyakosh-transfer = { version = "0.1.0", path = "../transfer" }
rand_chacha = "0.10.0"
serde_json = "1.0.154"
uuid = "1.28.0"

[dev-dependencies]
proptest = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
