[package]
name = "rahasyakosh-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
rahasyakosh-core = { version = "0.1.0", path = "../core" }
rahasyakosh-strength = { version = "0.1.0", path = "../strength" }
rahasyakosh-transfer = { version = "0.1.0", path = "../transfer" }
rand = "0.10.3"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["v7"] }
zeroize = "1.9.1"

[[bin]]
name = "rk"
path = "src/main.rs"
