[package]
name = "rahasyakosh-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"
publish = false
description = "Rahasyakosh desktop app (Dioxus)"

[dependencies]
dioxus = { version = "0.7.10", default-features = false, features = ["desktop", "macro", "html", "hooks", "signals", "launch", "document"] }
rahasyakosh-app = { path = "../../crates/app" }
rahasyakosh-clipboard = { path = "../../crates/clipboard" }
rahasyakosh-core = { path = "../../crates/core" }
rahasyakosh-store = { path = "../../crates/store", features = ["sqlite"] }
rahasyakosh-strength = { path = "../../crates/strength" }
rahasyakosh-transfer = { path = "../../crates/transfer" }
rand = "0.10.3"
tokio = { version = "1", features = ["time"] }
uuid = { version = "1.28.0", features = ["v7"] }
zeroize = { version = "1.9.1", features = ["derive"] }

# Linux only: hear from the desktop's accessibility service when a screen reader starts (src/platform/linux.rs).
# Already part of the GUI toolkit's dependencies; this only names it.
[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18.4"

[profile.release]
lto = "thin"
strip = true

[lib]
name = "rahasyakosh_desktop"
path = "src/lib.rs"

[dev-dependencies]
rand_chacha = "0.10.0"

[package.metadata.deb]
name = "rahasyakosh"
maintainer = "Hariharan Narayanan <enhariharan@gmail.com>"
copyright = "2024-2026 Hariharan Narayanan"
license-file = ["../../LICENSE", "0"]
section = "utils"
priority = "optional"
extended-description = """\
Rahasyakosh is a local-first password manager with end-to-end encryption, \
two-factor code generation (TOTP), import from Bitwarden / KeePassXC / 1Password, \
multi-profile support, and full screen-reader accessibility. \
No network connection, no telemetry, no account required. \
.
This is an alpha release. The app has not been independently audited. \
Do not store real secrets until an audit is complete."""
depends = "$auto, libwebkit2gtk-4.1-0, libgtk-3-0, libxdo3, libayatana-appindicator3-1, libsoup-3.0-0"
assets = [
  # main binary
  ["target/release/rahasyakosh-desktop", "usr/bin/rahasyakosh-desktop", "755"],
  # launcher: enables the accessibility service before the app starts (required for Orca)
  ["packaging/rahasyakosh-launcher", "usr/bin/rahasyakosh", "755"],
  # desktop entry for the app grid
  ["packaging/rahasyakosh-system.desktop", "usr/share/applications/rahasyakosh.desktop", "644"],
  # scalable icon
  ["packaging/rahasyakosh-chest.svg", "usr/share/icons/hicolor/scalable/apps/rahasyakosh.svg", "644"],
  # PNG icons at standard hicolor sizes
  ["packaging/icons/rahasyakosh-16.png",  "usr/share/icons/hicolor/16x16/apps/rahasyakosh.png",  "644"],
  ["packaging/icons/rahasyakosh-32.png",  "usr/share/icons/hicolor/32x32/apps/rahasyakosh.png",  "644"],
  ["packaging/icons/rahasyakosh-48.png",  "usr/share/icons/hicolor/48x48/apps/rahasyakosh.png",  "644"],
  ["packaging/icons/rahasyakosh-64.png",  "usr/share/icons/hicolor/64x64/apps/rahasyakosh.png",  "644"],
  ["packaging/icons/rahasyakosh-128.png", "usr/share/icons/hicolor/128x128/apps/rahasyakosh.png", "644"],
  ["packaging/icons/rahasyakosh-256.png", "usr/share/icons/hicolor/256x256/apps/rahasyakosh.png", "644"],
  # AppStream metadata (Software Centre, Flathub, Snap Store)
  ["packaging/io.github.enhariharan.Rahasyakosh.metainfo.xml", "usr/share/metainfo/io.github.enhariharan.Rahasyakosh.metainfo.xml", "644"],
  # readme
  ["../../README.md", "usr/share/doc/rahasyakosh/README.md", "644"],
]

# A separate workspace: the desktop app needs system GUI libraries (WebKitGTK on Linux) that the rest of the
# project, including its CI, does not.
[workspace]
