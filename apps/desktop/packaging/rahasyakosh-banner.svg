<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" role="img" aria-label="Rahasyakosh — local-first, end-to-end-encrypted password manager">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#163f80"/>
      <stop offset="100%" stop-color="#1f5fbf"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="720" height="240" fill="url(#bg)"/>

  <!-- Padlock icon (centred at 120,120, scaled to 90×90) -->
  <g transform="translate(75,75) scale(0.703)">
    <rect width="128" height="128" rx="26" fill="rgba(255,255,255,0.12)"/>
    <path d="M44 56V44a20 20 0 0 1 40 0v12" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
    <rect x="30" y="56" width="68" height="50" rx="10" fill="#fff"/>
    <circle cx="64" cy="77" r="7" fill="#1f5fbf"/>
    <rect x="61" y="80" width="6" height="14" rx="3" fill="#1f5fbf"/>
  </g>

  <!-- App name -->
  <text x="210" y="112"
        font-family="'Segoe UI', 'Noto Sans', 'Liberation Sans', Arial, sans-serif"
        font-size="52" font-weight="700" fill="#ffffff"
        letter-spacing="-0.5">Rahasyakosh</text>

  <!-- Hindi subtitle -->
  <text x="213" y="145"
        font-family="'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif"
        font-size="17" fill="rgba(255,255,255,0.65)">रहस्यकोश — Vault of Secrets</text>

  <!-- Tagline pills -->
  <rect x="213" y="163" width="148" height="26" rx="13" fill="rgba(255,255,255,0.15)"/>
  <text x="287" y="181" text-anchor="middle"
        font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif"
        font-size="13" fill="#ffffff">Local-first</text>

  <rect x="371" y="163" width="202" height="26" rx="13" fill="rgba(255,255,255,0.15)"/>
  <text x="472" y="181" text-anchor="middle"
        font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif"
        font-size="13" fill="#ffffff">End-to-end encrypted</text>

  <rect x="583" y="163" width="118" height="26" rx="13" fill="rgba(255,255,255,0.15)"/>
  <text x="642" y="181" text-anchor="middle"
        font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif"
        font-size="13" fill="#ffffff">Screen-reader friendly</text>
</svg>
